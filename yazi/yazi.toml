[mgr]
show_hidden = true
sort_by = "mtime"
sort_reverse = true
sort_dirs_first = true
linemode = "size"

[plugin]
prepend_preloaders = [
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
  ]
prepend_previewers = [
    { mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
    { mime = "{image,audio,video}/*", run = "mediainfo"},
    { mime = "application/x-subrip", run = "mediainfo"},
    # Archive previewer
	{ mime = "application/*zip",            run = "ouch" },
	{ mime = "application/x-tar",           run = "ouch" },
	{ mime = "application/x-bzip2",         run = "ouch" },
	{ mime = "application/x-7z-compressed", run = "ouch" },
	{ mime = "application/x-rar",           run = "ouch" },
	{ mime = "application/vnd.rar",         run = "ouch" },
	{ mime = "application/x-xz",            run = "ouch" },
	{ mime = "application/xz",              run = "ouch" },
	{ mime = "application/x-zstd",          run = "ouch" },
	{ mime = "application/zstd",            run = "ouch" },
	{ mime = "application/java-archive",    run = "ouch" },
]

[opener]
play = [
    { run = 'kitty -e mpv %s', orphan = true, for = "unix", desc = "Play" },
    { run = 'vlc %s', orphan = true, for = "unix", desc = "Play vlc" },
]
edit = [
    { run = '$EDITOR %s', block = true, for = "unix" },
]
open = [
    { run = 'xdg-open %s', desc = "Open" },
]
execute = [
    { run = 'kitty -e %s', orphan = true, desc = "Execute" },
]

[open]
prepend_rules = [
    { url = "*.json", use = "edit" },
    { url = "*.patch", use = "edit" },
    { url = "*.bin", use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.bb", use = "edit" },
    { mime = "application/x-executable", use = "execute" },
    { mime = "application/x-pie-executable", use = "execute" },
    { mime = "application/x-sharedlib", use = ["execute", "open"] },
]

[commands.open_terminal]
run = "kitty --working-directory '$PWD' &"
desc = "Open terminal in new window"

[tasks]
  image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB
